# ==============================================================================
# QuantumAML Nexus - External Secrets Operator (ESO) & KMS Integration
# ==============================================================================
# Step 5.4.3: KMS Envelope Encryption & Production Secret Management
# Integrates:
#   - AWS KMS / HashiCorp Vault HSM Backend
#   - External Secrets Operator syncing to in-memory Kubernetes Secret objects
#   - Memory-backed tmpfs volume projection for zero plaintext disk footprint
# ==============================================================================

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-kms-backend
spec:
  provider:
    vault:
      server: "https://vault.internal.quantumaml.io:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "quantumaml-enclave-role"
          serviceAccountRef:
            name: eso-vault-auth-sa
            namespace: kube-system
      caProvider:
        type: ConfigMap
        name: vault-ca-cert
        namespace: kube-system
        key: ca.crt

---
# ------------------------------------------------------------------------------
# 1. INVESTIGATION ENCLAVE EXTERNAL SECRET
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: investigation-kms-keys
  namespace: mesh-investigation
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kms-backend
    kind: ClusterSecretStore
  target:
    name: investigation-kms-secret
    creationPolicy: Owner
  data:
    - secretKey: KEK_KEY_ID
      remoteRef:
        key: kv/investigation/kms
        property: kek_key_id
    - secretKey: HMAC_AUDIT_SALT
      remoteRef:
        key: kv/investigation/kms
        property: audit_salt
    - secretKey: JWT_PUBLIC_KEY
      remoteRef:
        key: kv/investigation/auth
        property: public_key

---
# ------------------------------------------------------------------------------
# 2. BANK ENCLAVE EXTERNAL SECRET
# ------------------------------------------------------------------------------
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-kms-keys
  namespace: mesh-bank
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-kms-backend
    kind: ClusterSecretStore
  target:
    name: bank-kms-secret
    creationPolicy: Owner
  data:
    - secretKey: COMPLIANCE_SIGNING_KEY
      remoteRef:
        key: kv/bank/compliance
        property: ecdsa_private_key
    - secretKey: OFAC_SANCTIONS_SALT
      remoteRef:
        key: kv/bank/sanctions
        property: salt
    - secretKey: LEDGER_KEK_ARN
      remoteRef:
        key: kv/bank/kms
        property: ledger_kek_arn
