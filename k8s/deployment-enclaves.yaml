---
# ------------------------------------------------------------------------------
# 3. ZERO-TRUST SECURITY GATEWAY DEPLOYMENT
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantumaml-gateway
  namespace: mesh-gateway
  labels:
    app: quantumaml-gateway
    enclave.quantumaml.io/domain: gateway
spec:
  replicas: 4
  selector:
    matchLabels:
      app: quantumaml-gateway
  template:
    metadata:
      labels:
        app: quantumaml-gateway
        enclave.quantumaml.io/domain: gateway
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: gateway-app
          image: gcr.io/quantumaml-security/gateway:v1.0.0-distroless
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8443
              name: https
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8443
            periodSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
            periodSeconds: 3
          volumeMounts:
            - name: memory-tmp
              mountPath: /tmp
      volumes:
        - name: memory-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quantumaml-gateway
  namespace: mesh-gateway
spec:
  type: LoadBalancer
  selector:
    app: quantumaml-gateway
  ports:
    - name: https
      port: 443
      targetPort: 8443
