# ==============================================================================
# QuantumAML Nexus - Kubernetes Enclave Deployments & Hardened Pod Specs
# ==============================================================================
# Step 5.4.2: Pod Security Standards (Restricted Profile) & Enclave Services
# Enforces:
#   - USER nonroot:nonroot (UID 65532)
#   - readOnlyRootFilesystem: true
#   - POSIX Capabilities: ALL dropped
#   - allowPrivilegeEscalation: false
#   - Memory-backed tmpfs mounts for zero disk leakage
#   - Calibrated Startup, Liveness, and Readiness probes
# ==============================================================================

---
# ------------------------------------------------------------------------------
# 1. INVESTIGATION ENCLAVE DEPLOYMENT
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: investigation-service
  namespace: mesh-investigation
  labels:
    app: investigation-service
    enclave.quantumaml.io/domain: investigation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: investigation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: investigation-service
        enclave.quantumaml.io/domain: investigation
      annotations:
        sidecar.istio.io/inject: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "investigation-enclave"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: investigation-app
          image: gcr.io/quantumaml-security/investigation-backend:v1.0.0-distroless
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DOMAIN_ENCLAVE
              value: "INVESTIGATION_OFFICER"
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: memory-tmp
              mountPath: /tmp
            - name: memory-run
              mountPath: /run
      volumes:
        - name: memory-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: memory-run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: investigation-service
  namespace: mesh-investigation
spec:
  selector:
    app: investigation-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000

