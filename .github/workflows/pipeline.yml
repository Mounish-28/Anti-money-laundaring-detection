name: QuantumAML Nexus CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MODEL_DIR: "models"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ============================================================================
  # Job 1: Code Integrity, Formatting & Static Linting
  # ============================================================================
  static-analysis:
    name: Code Integrity & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install static quality analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy

      - name: Enforce Code Formatting (Black)
        run: |
          black --check app tests

      - name: Enforce PEP8 & Complexity Standards (Flake8)
        run: |
          flake8 app tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Static Type Contract Check (Mypy)
        run: |
          mypy app/schemas/ app/services/inference_engine.py --ignore-missing-imports --no-strict-optional

  # ============================================================================
  # Job 2: Automated Integration Tests & Latency SLA Gate
  # ============================================================================
  test-suite:
    name: Automated Integration Tests & Latency Gate
    needs: static-analysis
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch CPU Wheels & Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Execute Live Automated Test Suite
        env:
          REDIS_URL: redis://localhost:6379/0
          MODEL_DIR: models
        run: |
          pytest tests/test_api_live.py -v --tb=short

      - name: Assert Sub-50ms SLA Conformance Across All 5 Endpoints
        env:
          REDIS_URL: redis://localhost:6379/0
          MODEL_DIR: models
        run: |
          python - << 'EOF'
          import time
          import numpy as np
          from fastapi.testclient import TestClient
          from app.main import app, engine
          
          engine.warmup()
          client = TestClient(app)
          SLA_LIMIT_MS = 50.0
          
          endpoints = [
              ("IBM Transaction", "/api/v1/score/transaction", {
                  "transaction_id": "SLA_IBM_01", "from_bank": "10", "to_bank": "12",
                  "account_from": "ACC_S_01", "account_to": "ACC_R_01",
                  "amount": 1250.0, "currency": "US Dollar", "payment_format": "Credit Card"
              }),
              ("Time-Series AML", "/api/v1/score/timeseries", {
                  "account_id": "SLA_TS_01", "amount": 350.0, "ema_1h": 320.0,
                  "ema_24h": 300.0, "ema_7d": 280.0, "delta_t_seconds": 90.0,
                  "burstiness_index": 0.45, "sin_hour": 0.5, "cos_hour": 0.866,
                  "sin_dow": 0.433, "cos_dow": 0.901
              }),
              ("Elliptic Bitcoin", "/api/v1/score/crypto", {
                  "node_id": "SLA_BTC_01", "features": [0.05] * 166
              }),
              ("SAML-D", "/api/v1/score/samld", {
                  "transaction_id": "SLA_SAMLD_01", "sender_id": "S1", "receiver_id": "R1",
                  "amount": 5000.0, "fan_in_count": 5, "fan_out_count": 2, "sender_velocity_24h": 10.0
              }),
              ("IBM AMLSim", "/api/v1/score/amlsim", {
                  "transaction_id": "SLA_AMLSIM_01", "from_bank": "1", "to_bank": "2",
                  "account_from": "ACC_A", "account_to": "ACC_B",
                  "amount": 750.0, "currency": "US Dollar", "payment_format": "Cheque"
              })
          ]
          
          print("=" * 65)
          print(f"{'Endpoint Subsystem':<22} | {'P50 (ms)':<10} | {'P95 (ms)':<10} | {'Status'}")
          print("-" * 65)
          
          for name, path, payload in endpoints:
              for _ in range(3):
                  client.post(path, json=payload)
              
              latencies = []
              for _ in range(25):
                  t0 = time.perf_counter()
                  res = client.post(path, json=payload)
                  assert res.status_code == 200, f"Failed: {res.text}"
                  latencies.append((time.perf_counter() - t0) * 1000.0)
              
              p50 = np.percentile(latencies, 50)
              p95 = np.percentile(latencies, 95)
              status = "PASS" if p95 < SLA_LIMIT_MS else "FAIL"
              print(f"{name:<22} | {p50:<10.2f} | {p95:<10.2f} | {status}")
              assert p95 < SLA_LIMIT_MS, f"SLA Breach on {name}: P95 {p95:.2f}ms exceeds {SLA_LIMIT_MS}ms"
          
          print("=" * 65)
          print("[SUCCESS] All 5 endpoints strictly conform to sub-50ms latency SLA.")
          EOF

  # ============================================================================
  # Job 3: Production Container Build & Vulnerability Security Scan
  # ============================================================================
  container-audit:
    name: Container Build & Vulnerability Scan
    needs: test-suite
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out code repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quantumaml-nexus:audit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image for CRITICAL Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "quantumaml-nexus:audit"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Ephemeral In-Container Healthcheck Probe
        run: |
          docker run -d --name ephemeral_probe -p 8000:8000 quantumaml-nexus:audit
          echo "Awaiting serving container bootstrap..."
          sleep 12
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health || (docker logs ephemeral_probe && exit 1)
          echo "Probe confirmed HTTP 200 HEALTHY. Tearing down ephemeral container."
          docker stop ephemeral_probe
          docker rm ephemeral_probe
